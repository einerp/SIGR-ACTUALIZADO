name: SIGR CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: sigr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Build, test, calidad y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Análisis estático con ESLint
        run: npm run lint

      - name: Escanear vulnerabilidades de dependencias
        run: npm audit --audit-level=high

      - name: Ejecutar pruebas unitarias e integración
        run: npm test

      - name: Construir artefacto reproducible
        run: npm run build

      - name: Publicar artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: sigr-build-${{ github.sha }}
          path: dist
          retention-days: 7

  despliegue:
    name: Confirmar deploy de Vercel y smoke test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.publicar.outputs.url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Esperar despliegue nativo de Vercel para este commit
        id: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://sigr-actualizado.vercel.app
        run: |
          for attempt in {1..40}; do
            DEPLOYMENTS=$(gh api "repos/${REPOSITORY}/deployments?sha=${COMMIT_SHA}&per_page=100")
            DEPLOYMENT_ID=$(jq -r '[.[] | select(.environment | ascii_downcase == "production")][0].id // empty' <<< "$DEPLOYMENTS")
            if [ -n "$DEPLOYMENT_ID" ]; then
              STATUSES=$(gh api "repos/${REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses")
              STATE=$(jq -r '.[0].state // "pending"' <<< "$STATUSES")
              echo "Intento ${attempt}: despliegue ${DEPLOYMENT_ID}, estado ${STATE}"
              if [ "$STATE" = "success" ]; then
                echo "url=${PRODUCTION_URL}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$STATE" =~ ^(failure|error|inactive)$ ]]; then
                echo "Vercel terminó con estado ${STATE}" >&2
                exit 1
              fi
            else
              echo "Intento ${attempt}: Vercel aún no registra el despliegue"
            fi
            sleep 15
          done
          echo "Tiempo de espera agotado para el despliegue de Vercel" >&2
          exit 1

      - name: Verificar disponibilidad, autenticación y salud
        env:
          SMOKE_URL: ${{ steps.publicar.outputs.url }}
        run: node scripts/smoke-test.js "$SMOKE_URL"
